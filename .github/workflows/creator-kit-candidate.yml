name: Creator Kit candidate

on:
  pull_request:
    paths:
      - "creator-kit-fixtures/**"
      - "creator-kit-negative-fixtures/**"
      - "creator-kit-templates/**"
      - "scripts/creator-kit/**"
      - "creator-kit/**"
      - "data/v2/examples/player-show-complete-cue-tracks/**"
      - "package.json"
      - ".github/workflows/creator-kit-*.yml"

permissions:
  contents: read

concurrency:
  group: creator-kit-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Resolve the committed source lock
        id: source
        run: |
          set -euo pipefail
          source_commit="$(jq -r .commit creator-kit/source-lock.json)"
          [[ "$source_commit" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$source_commit" "$GITHUB_SHA"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
      - name: Rebuild the exact committed candidate
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
        run: bun run creator-kit:build -- --source-commit "$SOURCE_COMMIT"
      - name: Verify committed candidate matches the generator
        run: git diff --exit-code -- creator-kit
      - run: bun run creator-kit:check
