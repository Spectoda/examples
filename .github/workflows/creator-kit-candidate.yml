name: Creator Kit candidate

on:
  pull_request:
    paths:
      - "creator-kit-fixtures/**"
      - "creator-kit-negative-fixtures/**"
      - "creator-kit-templates/**"
      - "scripts/creator-kit/**"
      - "creator-kit/**"
      - "data/v2/examples/player-show-complete-cue-tracks/**"
      - "package.json"
      - ".github/workflows/creator-kit-*.yml"

permissions:
  contents: read

concurrency:
  group: creator-kit-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun run creator-kit:check
      - name: Build the deterministic archive twice
        run: |
          set -euo pipefail
          node scripts/creator-kit/build-release-candidate.mjs --release-dir .creator-kit-tmp/first --source-commit "$GITHUB_SHA"
          node scripts/creator-kit/build-release-candidate.mjs --release-dir .creator-kit-tmp/second --source-commit "$GITHUB_SHA"
          cmp .creator-kit-tmp/first/spectoda-creator-kit-0.1.0-rc.3.tar .creator-kit-tmp/second/spectoda-creator-kit-0.1.0-rc.3.tar
          cmp .creator-kit-tmp/first/provenance.json .creator-kit-tmp/second/provenance.json
          git diff --exit-code -- creator-kit
