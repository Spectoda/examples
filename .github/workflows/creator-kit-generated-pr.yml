name: Creator Kit generated review PR

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type GENERATE_CREATOR_KIT_REVIEW_PR to create a normal review PR"
        required: true
        type: string
      source_sha:
        description: "Exact Examples commit to regenerate from"
        required: true
        type: string

permissions:
  contents: read

jobs:
  generate:
    if: ${{ inputs.confirmation == 'GENERATE_CREATOR_KIT_REVIEW_PR' && inputs.source_sha == github.sha }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Verify exact source head
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Build from the exact source head
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: bun run creator-kit:build -- --source-commit "$SOURCE_SHA"
      - run: bun run creator-kit:check
      - name: Open normal generated review PR
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          branch="automation/creator-kit-${{ github.run_id }}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add creator-kit
          git commit -m "chore: regenerate Creator Kit candidate"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --set-upstream origin "$branch"
          gh pr create --title "chore: regenerate Creator Kit candidate" --body "Generated from exact source head ${SOURCE_SHA}. Human review is required; this workflow does not publish a Release." --base main --head "$branch"
