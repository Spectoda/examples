name: Creator Kit release

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type PUBLISH_CREATOR_KIT_RELEASE after human review and license approval"
        required: true
        type: string
      version:
        description: "Exact semver release version"
        required: true
        type: string
      source_sha:
        description: "Exact reviewed Examples commit"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    if: ${{ inputs.confirmation == 'PUBLISH_CREATOR_KIT_RELEASE' && inputs.source_sha == github.sha && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: creator-kit-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Verify reviewed exact head
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Validate release inputs
        env:
          CREATOR_KIT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$CREATOR_KIT_VERSION" = "0.1.0-rc.3"
          test "$(jq -r .version creator-kit/bundle.json)" = "$CREATOR_KIT_VERSION"
      - run: bun run creator-kit:check
      - name: Require the approved prerelease license and channel posture
        run: |
          set -euo pipefail
          jq -e '.publicationAllowed == true and .realDocumentationExportAllowed == true and .entries == ["CC-BY-4.0", "MIT"]' creator-kit/licenses.json
          jq -e '.state == "unpublished" and .version == null and .digest == null and .releaseUrl == null' creator-kit/stable-channel.json
      - name: Create release assets locally
        env:
          CREATOR_KIT_VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_sha }}
        run: node scripts/creator-kit/build-release-candidate.mjs --bundle creator-kit --release-dir .creator-kit-tmp/release --version "$CREATOR_KIT_VERSION" --source-commit "$SOURCE_COMMIT"
      - name: Verify release asset build preserved the reviewed candidate
        run: git diff --exit-code -- creator-kit
      - name: Publish the explicitly approved GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          CREATOR_KIT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if gh release view "creator-kit-v${CREATOR_KIT_VERSION}" >/dev/null 2>&1; then
            echo "Release creator-kit-v${CREATOR_KIT_VERSION} already exists" >&2
            exit 1
          fi
          gh release create "creator-kit-v${CREATOR_KIT_VERSION}" .creator-kit-tmp/release/* \
            --target "$GITHUB_SHA" \
            --title "Spectoda Creator Kit ${CREATOR_KIT_VERSION}" \
            --notes-file creator-kit/RELEASE_NOTES.md \
            --prerelease
