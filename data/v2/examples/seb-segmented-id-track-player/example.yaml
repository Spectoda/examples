schemaVersion: example.v2
slug: seb-segmented-id-track-player
title: Timeline-Driven Segmented Single-ID SEB Track
category: controller
summary: >-
  Drive one logical brigh[ID1] Track from the shared timeline using bounded SEB
  segments. Project Berry owns segment selection, local-millis projections,
  pause behavior, cursors and explicit checkpoint reconstruction after seek.
tags:
  - berry-plugin
  - event-player
  - eventstore
  - networkstorage
  - seb
  - timeline
  - checkpoint
hardware: >-
  Requires exactly firmware 0.12.11 with timeline.getState(), timeline.at()
  and final SEB v1. Install the same Berry source and binary NetworkStorage
  artifacts on each Controller participating in distributed playback. The
  example targets only synthetic brigh[ID1] and supports explicit timeline
  entry/seek positions 0 ms and 500 ms.
files:
  - path: README.md
    role: readme
    language: markdown
  - path: segmented-track-player.be
    role: copy-ready Project Berry player
    language: berry
  - path: track-artifacts.json
    role: exact NetworkStorage segment and checkpoint bytes
    language: json
related:
  - seb-causal-scene-recall
