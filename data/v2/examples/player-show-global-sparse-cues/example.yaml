title: Global sparse-Cue Event Player from player.show
category: controller
summary: >-
  Canonical firmware 0.12.11 Project Berry Player for one static player.show
  SPM v3 manifest and deterministic mixed-ID player.NNN SEB slots. Every
  Controller lands every record while Tracks remain per-ID authoring lanes and
  Cues remain sparse.
